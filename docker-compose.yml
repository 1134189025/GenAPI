services:
  app:
    image: ghcr.io/1134189025/genapi:latest
    container_name: genapi
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    environment:
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      - STORAGE_BACKEND=json

      # Docker 部署会显示版本检查，但不支持网页一键更新。
      # 网页一键更新仅支持 deploy/install.sh 安装的 systemd 二进制模式。
      - GENAPI_DEPLOYMENT_MODE=docker
      - GENAPI_BUILD_TYPE=docker
      # 可选：用于访问 GitHub Releases API，避免匿名请求限流。
      # - GITHUB_TOKEN=ghp_xxxxxxxxxxxx

      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # - DATABASE_URL=sqlite:///app/data/accounts.db

      # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
      # - GIT_REPO_URL=https://github.com/user/repo.git
      # - GIT_TOKEN=ghp_xxxxxxxxxxxx
      # - GIT_BRANCH=main
      # - GIT_FILE_PATH=accounts.json

      # 基础 URL (可选)
      # - GENAPI_BASE_URL=https://your-domain.com
