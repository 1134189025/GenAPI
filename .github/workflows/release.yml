name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.9"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          case "${tag}" in
            v*) ;;
            *)
              echo "::error::Release tag must start with v"
              exit 1
              ;;
          esac

          version="${tag#v}"
          if [ -z "${version}" ]; then
            echo "::error::Release version is empty"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-web:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Stamp release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "${VERSION}" > VERSION

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build web static output
        working-directory: web
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run build

      - name: Upload web static output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          if-no-files-found: error

  build-binary:
    needs:
      - prepare
      - build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Stamp release version
        run: printf '%s\n' "${VERSION}" > VERSION

      - name: Download web static output
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web_dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyInstaller and app dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --no-dev --no-install-project
          uv pip install "pyinstaller>=6.11"

      - name: Build PyInstaller bundle
        run: |
          uv run pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name genapi \
            --paths "." \
            --add-data "VERSION:." \
            --add-data "web_dist:web_dist" \
            --collect-all curl_cffi \
            --collect-data tiktoken \
            --collect-submodules sqlalchemy.dialects \
            --collect-submodules tiktoken_ext \
            scripts/pyinstaller_entrypoint.py

          test -x dist/genapi
          dist/genapi --version | grep -Fx "${VERSION}"

      - name: Package binary archive
        run: |
          PACKAGE_DIR="genapi_${VERSION}_linux_${ARCH}"
          mkdir -p "release/${PACKAGE_DIR}"
          cp dist/genapi "release/${PACKAGE_DIR}/genapi"
          cp VERSION "release/${PACKAGE_DIR}/VERSION"
          cp -a web_dist "release/${PACKAGE_DIR}/web_dist"
          tar -C release -czf "genapi_${VERSION}_linux_${ARCH}.tar.gz" "${PACKAGE_DIR}"

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: genapi_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
          path: genapi_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-binary
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: genapi_*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum genapi_*.tar.gz > checksums.txt

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPO}" --title "Genapi ${VERSION}" --notes "Genapi ${VERSION}"
          fi
          gh release upload "${TAG}" --repo "${REPO}" release/genapi_*.tar.gz release/checksums.txt --clobber
